services:
  db:
    image: postgres:16.14-alpine
    container_name: sigil-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - ./sigil-backend/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sigil_db}
      POSTGRES_USER: ${DB_USERNAME:-sigil_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
  
  backend:
    build:
      context: ./sigil-backend
      dockerfile: ./dockerfiles/Dockerfile
    container_name: sigil-backend
    working_dir: /var/www/html
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./sigil-backend/.env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./sigil-backend:/var/www/html
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:24-alpine
    container_name: sigil-frontend
    working_dir: /app
    ports:
      - "5174:5174"
    env_file:
      - ./sigil-frontend/.env
    volumes:
      - ./sigil-frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pg_data: